name: Check for Upstream Release

on:
  workflow_dispatch:
  schedule:
     # 每天 UTC 8:00 检查一次（原为每小时，可按需调整）
     - cron: '0 8 * * *'

# ‼️ 上游仓库信息
env:
  UPSTREAM_REPO: "nikkinikki-org/OpenWrt-nikki"
  MAKEFILE_PATH: "mihomo-meta/Makefile"

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      run_job: ${{ steps.check_new.outputs.run_job }}
      latest_tag: ${{ steps.vars.outputs.latest_tag }}

    steps:
      - name: 1. 获取上游 Makefile 文件内容
        id: get_makefile
        uses: octokit/request-action@v3.x
        with:
          route: GET /repos/${{ env.UPSTREAM_REPO }}/contents/${{ env.MAKEFILE_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. 解码并提取 PKG_VERSION
        id: vars
        run: |
          # 解码 Base64 内容（处理换行符）
          CONTENT=$(echo "${{ fromJson(steps.get_makefile.outputs.data).content }}" | base64 -d 2>/dev/null || echo "${{ fromJson(steps.get_makefile.outputs.data).content }}" | base64 --decode)
          
          # 提取 PKG_VERSION:= 后面的版本号
          LATEST_TAG=$(echo "$CONTENT" | grep -oP 'PKG_VERSION:=\K.*' | tr -d '[:space:]')
          
          if [ -z "$LATEST_TAG" ]; then
            echo "⚠️ 未能从 Makefile 中提取到 PKG_VERSION，请检查路径是否正确。"
            echo "latest_tag=unknown" >> $GITHUB_OUTPUT
          else
            echo "✅ 提取到 PKG_VERSION: $LATEST_TAG"
            echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          fi

      - name: 3. 恢复缓存的版本号
        id: cache-tag
        uses: actions/cache/restore@v5
        with:
          path: ./.cache/latest_tag
          key: upstream-version-${{ steps.vars.outputs.latest_tag }}

      - name: 4. 检查版本号是否为新
        id: check_new
        run: |
          if [ "${{ steps.cache-tag.outputs.cache-hit }}" == "true" ]; then
            echo "版本 ${{ steps.vars.outputs.latest_tag }} 已经被处理过，跳过。"
            echo "run_job=false" >> $GITHUB_OUTPUT
          elif [ "${{ steps.vars.outputs.latest_tag }}" == "unknown" ]; then
            echo "⚠️ 版本号提取失败，跳过本次执行。"
            echo "run_job=false" >> $GITHUB_OUTPUT
          else
            echo "检测到新版本 ${{ steps.vars.outputs.latest_tag }}，准备运行任务。"
            echo "run_job=true" >> $GITHUB_OUTPUT
          fi

      - name: 5. (如果为新) 创建用于缓存的标记文件
        if: steps.check_new.outputs.run_job == 'true'
        run: |
          mkdir -p ./.cache
          echo "${{ steps.vars.outputs.latest_tag }}" > ./.cache/latest_tag

      - name: 6. (如果为新) 缓存新版本号
        if: steps.check_new.outputs.run_job == 'true'
        uses: actions/cache/save@v5
        with:
          path: ./.cache/latest_tag
          key: upstream-version-${{ steps.vars.outputs.latest_tag }}

      - name: 7. Delete workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 1
          keep_minimum_runs: 3

  run-target-workflow:
    needs: check
    if: needs.check.outputs.run_job == 'true'
    uses: ./.github/workflows/build-rax3000m-imoutowrt-chasey.yml
    with:
      upstream_tag: ${{ needs.check.outputs.latest_tag }}
    secrets: inherit
